<div id="np-card" class="np-card np-hidden">
    <!-- Background art layer — sits behind all content, shown via .np-art-bg class -->
    <div id="np-bg-art" class="np-bg-art"></div>

    <div class="np-art-wrap">
        <div class="np-disc">
            <img id="np-art" src="" alt="" />
            <div class="np-spindle"></div>
        </div>
    </div>
    <div class="np-meta">
        <div id="np-title" class="np-title"></div>
        <div id="np-artist" class="np-artist"></div>
        <div class="np-progress-row">
            <div id="np-dot" class="np-dot"></div>
            <div class="np-track">
                <div id="np-fill" class="np-fill"></div>
            </div>
            <div id="np-app" class="np-app"></div>
        </div>
        <div class="np-time-row">
            <span id="np-pos">0:00</span>
            <span id="np-dur">0:00</span>
        </div>
    </div>
</div>
<canvas id="np-canvas" width="32" height="32" style="display:none"></canvas>
