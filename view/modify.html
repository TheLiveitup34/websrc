<div class="shell" id="shell">

  <!-- TOP ─────────────────────────────────────── -->
  <div class="topbar">
    <button class="nav-toggle" id="nav-toggle" title="Hide sidebar" aria-label="Hide sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand">
      <div class="logo">M</div>
      <div class="name">Modify<small>overlay editor</small></div>
    </div>

    <div class="url-box" id="url-box" title="Click to copy · Drag onto OBS">
      <span class="url-proto">src://</span>
      <span class="url-text" id="url-text">target.html</span>
      <span class="saved-inline"><span class="dot"></span><span id="save-txt">Saved</span></span>
    </div>

    <button class="btn" id="btn-copy-top" title="Copy URL">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy
    </button>

    <a class="btn drag-btn" id="drag-handle" draggable="true" title="Drag into OBS to add as a Browser Source">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3 M9 5l3-3 3 3 M15 19l-3 3-3-3 M19 9l3 3-3 3 M2 12h20 M12 2v20"/></svg>
      Drag to OBS
    </a>

    <button class="btn" id="btn-reset" title="Reset all settings to defaults">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 15-6.7L21 8 M21 3v5h-5 M21 12a9 9 0 0 1-15 6.7L3 16 M3 21v-5h5"/></svg>
    </button>
  </div>

  <!-- NAV ─────────────────────────────────────── -->
  <aside class="nav" id="nav"></aside>

  <!-- CONFIG ──────────────────────────────────── -->
  <section class="cfg" id="cfg"></section>

  <!-- PREVIEW ─────────────────────────────────── -->
  <section class="preview">
    <div class="preview-wrap">
      <div class="preview-frame">
        <iframe id="frame" src="about:blank"></iframe>
      </div>
    </div>
  </section>
<button class="cfg-reopen" id="cfg-reopen" hidden><svg xmlns="http://www.w3.org/2000/svg" height="24px"
          viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
          <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
     </svg></button>
</div>



<div class="toast" id="toast"><span class="ic">✓</span><span id="toast-msg">Copied</span></div>
