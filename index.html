<!DOCTYPE html>
<html lang="en">

<head>
    <title>WebSRC - Streamer Widget Toolkit</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style id="preloadstyles">
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0f0f;
            --panel: #000000;
            --panel-2: #181818;
            --ink: #ffffff;
            --ink-2: #efefef;
            --muted: #8a8a8a;
            --dim: #4a4a4a;
            --line: #1e1e1e;
            --line-2: #2a2a2a;
            --hover: #181818;
            --accent: #e85d3b;
            --accent-soft: #2a1510;
            --ok: #2fa36a;
            --ok-soft: #0f2218;
            --sans: 'Poppins', ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
        }

        body {
            background: var(--bg);
            font-family: var(--sans);
            overflow: hidden;
        }

        #preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ── GRID BACKGROUND ── */
        #preloader::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 36px 36px;
            animation: gridPulse 4s ease-in-out infinite;
        }

        /* ── RADIAL VIGNETTE ── */
        #preloader::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 65% 65% at 50% 50%, transparent 20%, var(--panel) 100%);
            pointer-events: none;
        }

        @keyframes gridPulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.9;
            }
        }

        /* ── PLATFORM LABEL ── */
        .platform-label {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            white-space: nowrap;
            text-align: center;
        }

        .platform-label span {
            color: var(--ink-2);
            transition: color 0.4s ease;
        }

        /* ── BROADCAST RINGS ── */
        .rings {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 40px;
            z-index: 1;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid var(--accent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            animation: ringExpand 2.6s ease-out infinite;
        }

        .ring:nth-child(2) {
            width: 38px;
            height: 38px;
            animation-delay: 0s;
        }

        .ring:nth-child(3) {
            width: 72px;
            height: 72px;
            animation-delay: 0.45s;
        }

        .ring:nth-child(4) {
            width: 108px;
            height: 108px;
            animation-delay: 0.9s;
        }

        .ring:nth-child(5) {
            width: 144px;
            height: 144px;
            animation-delay: 1.35s;
        }

        @keyframes ringExpand {
            0% {
                transform: translate(-50%, -50%) scale(0.2);
                opacity: 1;
            }

            70% {
                opacity: 0.12;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        /* ── CENTER ICON ── */
        .icon-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.5s ease, box-shadow 0.5s ease;
        }

        .icon-wrap svg.platform-icon {
            width: 26px;
            height: 26px;
            fill: #fff;
            position: absolute;
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .icon-wrap svg.platform-icon.active {
            opacity: 1;
            transform: scale(1);
        }

        .live-dot {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 13px;
            height: 13px;
            background: var(--ok);
            border-radius: 50%;
            border: 2px solid var(--panel);
            animation: livePulse 1.2s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes livePulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }

        /* ── WORDMARK ── */
        .wordmark {
            z-index: 1;
            text-align: center;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
        }

        .wordmark h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -2.5px;
            color: var(--ink);
            line-height: 1;
        }

        .wordmark h1 span {
            color: var(--ink);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 12px;
            padding: 5px 14px;
            background: var(--accent-soft);
            border: 1px solid rgba(232, 93, 59, 0.2);
            border-radius: 100px;
            font-size: 0.63rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.38s both;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: var(--ok);
            border-radius: 50%;
            animation: livePulse 1.4s ease-in-out infinite;
            flex-shrink: 0;
        }

        /* ── SUB LABEL ── */
        .sub {
            z-index: 1;
            margin-top: 9px;
            font-size: 0.71rem;
            font-weight: 400;
            color: var(--muted);
            letter-spacing: 0.03em;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.52s both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── PROGRESS BAR ── */
        .progress-wrap {
            z-index: 1;
            margin-top: 48px;
            width: 200px;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.66s both;
        }

        .progress-track {
            height: 2px;
            background: var(--line-2);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 99px;
            animation: fillBar 2.8s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
            box-shadow: 0 0 10px rgba(232, 93, 59, 0.7);
        }

        @keyframes fillBar {
            0% {
                width: 0%;
            }

            35% {
                width: 50%;
            }

            65% {
                width: 75%;
            }

            88% {
                width: 91%;
            }

            100% {
                width: 100%;
            }
        }

        .progress-label {
            margin-top: 10px;
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--dim);
            text-align: center;
        }

        /* ── BOTTOM TICKER ── */
        .ticker {
            position: absolute;
            bottom: 28px;
            z-index: 1;
            width: 100%;
            overflow: hidden;
            mask-image: linear-gradient(90deg, transparent, black 12%, black 88%, transparent);
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.85s both;
        }

        .ticker-inner {
            display: flex;
            gap: 0;
            white-space: nowrap;
            will-change: transform;
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            font-size: 0.57rem;
            font-weight: 500;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--dim);
            padding: 0 24px;
        }

        .ticker-item::before {
            content: '';
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.55;
            flex-shrink: 0;
            margin-right: 24px;
        }

        /* ── CORNER BRACKETS ── */
        .corner {
            position: absolute;
            width: 36px;
            height: 36px;
            z-index: 1;
            opacity: 0.25;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 1s both;
        }

        .corner svg {
            width: 100%;
            height: 100%;
            stroke: var(--accent);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: square;
        }

        .corner.tl {
            top: 22px;
            left: 22px;
        }

        .corner.tr {
            top: 22px;
            right: 22px;
        }

        .corner.bl {
            bottom: 22px;
            left: 22px;
        }

        .corner.br {
            bottom: 22px;
            right: 22px;
        }

        /* ── FADE OUT ── */
        #preloader.done {
            animation: preloaderOut 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            /* forwards keeps opacity:0 locked after the animation ends,
               preventing any repaint flash before animationend fires */
            animation-fill-mode: forwards;
            /* will-change tells the compositor to keep this on its own layer
               so opacity changes don't trigger a main-thread repaint */
            will-change: opacity;
        }

        @keyframes preloaderOut {
            0% {
                opacity: 1;
                pointer-events: none;
            }

            100% {
                opacity: 0;
                pointer-events: none;
                visibility: hidden;
            }
        }
    </style>
    <meta name="papergrid-env" content="development">
    <script data-init type="module" defer>
        import Core from '/libraries/Core.js';
        const core = new Core();
        window.console = console;
        if (!parameters.has('streaming') || !userAgent.includes('obs') || !userAgent.includes('streamlabs') || !userAgent.includes('meld') || !embeded ) {
            window.addEventListener('websrc:ready', () => {
                // If we're in a streaming context, skip the preloader entirely for faster load-in
                setTimeout(() => {
                    if (document.getElementById('preloader')) {
                        document.getElementById('preloader')?.classList.add('done');
                    }
                }, 3000);
                    // Delay the fade-out slightly to ensure it registers after the last label update               
        });
        } 
    </script>
</head>

<body>

    <div id="preloader">

        <!-- Corner brackets -->
        <div class="corner tl"><svg viewBox="0 0 36 36">
                <path d="M36 0 H8 Q0 0 0 8 V36" />
            </svg></div>
        <div class="corner tr"><svg viewBox="0 0 36 36">
                <path d="M0 0 H28 Q36 0 36 8 V36" />
            </svg></div>
        <div class="corner bl"><svg viewBox="0 0 36 36">
                <path d="M36 36 H8 Q0 36 0 28 V0" />
            </svg></div>
        <div class="corner br"><svg viewBox="0 0 36 36">
                <path d="M0 36 H28 Q36 36 36 28 V0" />
            </svg></div>

        <!-- Broadcast rings + icon -->
        <div class="rings">
            <p class="platform-label">Supported on <span id="platformName">Twitch</span></p>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="icon-wrap" id="platformIcon">
                <div class="live-dot"></div>
                <!-- Platform SVGs injected by JS -->
            </div>
        </div>

        <!-- Wordmark -->
        <div class="wordmark">
            <h1>Web<span>SRC</span></h1>
            <div class="badge">
                <span class="badge-dot"></span>
                Streamer Widget Toolkit
            </div>
        </div>

        <!-- Sublabel -->
        <p class="sub">Your broadcast. Your widgets. Your way.</p>

        <!-- Progress -->
        <div class="progress-wrap">
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
            <p class="progress-label" id="loadLabel">Initializing…</p>
        </div>

        <!-- Scrolling ticker -->
        <div class="ticker">
            <div class="ticker-inner" id="tickerInner"></div>
        </div>

    </div>

    <script>
        let parameters = new URLSearchParams(window.location.search);
        let embeded = window.self !== window.top;
        console.log('Embeded:', embeded);
        console.log('Parameters:', parameters.toString());
        let userAgent = navigator.userAgent.toLowerCase();
        if (parameters.has('streaming') || userAgent.includes('obs') || userAgent.includes('streamlabs') || userAgent.includes('meld') || embeded === true) {
            // If we're in a streaming context, skip the preloader entirely for faster load-in
            console.log('Streaming context detected, skipping preloader...');
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('preloader')?.classList.add('done');
            // hide all preloader so no flash

        } else {
             // ═══════════════════════════════════════════════════════════════
            // PLATFORM LIST — add or remove platforms here as you add support
            // Each entry: { name, color, glow, svg }
            // ═══════════════════════════════════════════════════════════════
            const PLATFORMS = [
                {
                    name: 'Twitch',
                    color: '#9146ff',
                    glow: 'rgba(145,70,255,',
                    svg: '<path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>'
                },
                {
                    name: 'Kick',
                    color: '#53fc18',
                    glow: 'rgba(83,252,24,',
                    svg: '<path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm-1.5 17.25H7.875V6.75H10.5v10.5zm6.375 0h-2.438l-2.812-4.5v4.5H9.75V6.75h2.438l2.812 4.5V6.75h1.875v10.5z"/>'
                },
                {
                    name: 'YouTube',
                    color: '#ff0000',
                    glow: 'rgba(255,0,0,',
                    svg: '<path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>'
                },
                {
                    name: 'TikTok',
                    color: '#010101',
                    glow: 'rgba(105,201,208,',
                    svg: '<path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/>'
                },
                // {
                //     name: 'Facebook',
                //     color: '#1877f2',
                //     glow: 'rgba(24,119,242,',
                //     svg: '<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>'
                // },
                // {
                //     name: 'Instagram',
                //     color: '#e1306c',
                //     glow: 'rgba(225,48,108,',
                //     svg: '<path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>'
                // },
            ];
            // ═══════════════════════════════════════════════════════════════

            // ── BUILD PLATFORM ICONS ──
            const iconWrap = document.getElementById('platformIcon');
            PLATFORMS.forEach((p, idx) => {
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '0 0 24 24');
                svg.classList.add('platform-icon');
                svg.id = 'platform-' + idx;
                svg.innerHTML = p.svg;
                iconWrap.appendChild(svg);
            });

            // ── PLATFORM SWITCHER ──
            let currentPlatform = 0;
            const SWITCH_INTERVAL = 2200;
            const platformNameEl = document.getElementById('platformName');

            const showPlatform = (idx) => {
                const p = PLATFORMS[idx];
                iconWrap.style.background = p.color;
                iconWrap.style.boxShadow = `0 0 28px ${p.glow}0.6), 0 0 64px ${p.glow}0.25)`;
                document.querySelectorAll('.platform-icon').forEach(el => el.classList.remove('active'));
                document.getElementById('platform-' + idx).classList.add('active');
                platformNameEl.textContent = p.name;
            };

            showPlatform(0);
            // Store interval handle so we can cancel it on dismiss
            const platformInterval = setInterval(() => {
                currentPlatform = (currentPlatform + 1) % PLATFORMS.length;
                showPlatform(currentPlatform);
            }, SWITCH_INTERVAL);

            // ── TICKER ──
            // Add or remove items freely — works with any count, even just one.
            const items = ['Watch System', 'Flashbang', 'Suggestions', 'Alerts'];

            const tickerEl = document.getElementById('tickerInner');

            // Step 1: render ONE set of items to measure their total width
            const renderSet = () => {
                const frag = document.createDocumentFragment();
                items.forEach(t => {
                    const el = document.createElement('span');
                    el.className = 'ticker-item';
                    el.textContent = t;
                    frag.appendChild(el);
                });
                return frag;
            };

            tickerEl.appendChild(renderSet());

            // Store rAF handle so the loop can be cancelled on dismiss
            let tickerRAF = null;

            // Step 2: after layout, measure one set and fill to well beyond screen width
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    const oneSetWidth = tickerEl.scrollWidth;
                    const copies = Math.ceil((window.innerWidth * 2) / oneSetWidth) + 2;

                    tickerEl.innerHTML = '';
                    for (let i = 0; i < copies; i++) {
                        tickerEl.appendChild(renderSet());
                    }

                    let x = 0;
                    const speed = 0.6;

                    const loop = () => {
                        x -= speed;
                        if (x <= -oneSetWidth) x += oneSetWidth;
                        tickerEl.style.transform = `translateX(${x}px)`;
                        tickerRAF = requestAnimationFrame(loop);
                    };

                    tickerRAF = requestAnimationFrame(loop);
                });
            });

            // ── MINIMUM DISPLAY TIME ──
            // Guarantees the preloader is always visible for at least this long
            // regardless of how fast the page loads. Prevents a flash on fast loads.
            const MIN_DISPLAY_MS = 3000;
            const startTime = Date.now();

            // Fires websrc:ready only when BOTH conditions are true:
            //   1. The label sequence has reached "Ready!"
            //   2. MIN_DISPLAY_MS has elapsed since the preloader appeared
            let labelsDone = false;
            let minTimeDone = false;

            const tryFireReady = () => {
                if (!labelsDone || !minTimeDone) return;
                const detail = { timestamp: Date.now() };
                window.__websrcReady = detail;
                document.dispatchEvent(new CustomEvent('websrc:ready', { detail }));
                window.dispatchEvent(new CustomEvent('websrc:ready', { detail }));
            };

            // Minimum time gate
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, MIN_DISPLAY_MS - elapsed);
            setTimeout(() => { minTimeDone = true; tryFireReady(); }, remaining);

            // ── LOAD LABELS ──
            const labels = ['Initializing…', 'Loading widgets…', 'Connecting sources…', 'Almost ready…', 'Ready!'];
            const labelEl = document.getElementById('loadLabel');
            let labelIndex = 0;
            let labelTimeout = null;

            const advanceLabel = () => {
                labelIndex++;
                if (labelIndex >= labels.length) return;
                labelEl.textContent = labels[labelIndex];

                if (labelIndex < labels.length - 1) {
                    labelTimeout = setTimeout(advanceLabel, 620);
                } else {
                    // "Ready!" is now visible — mark labels done and try to fire
                    labelsDone = true;
                    tryFireReady();
                }
            };

            labelTimeout = setTimeout(advanceLabel, 620);

            // ── CLEANUP ──
            // Cancels all running loops and timers so nothing lingers after dismiss.
            // Called automatically by both websrcKill() and the standard fade-out.
            const cleanup = () => {
                if (tickerRAF !== null) { cancelAnimationFrame(tickerRAF); tickerRAF = null; }
                if (labelTimeout !== null) { clearTimeout(labelTimeout); labelTimeout = null; }
                clearInterval(platformInterval);
            };

            // ── HOW TO LISTEN (use either document or window) ──
            //
            // Option A — on document:
            //   document.addEventListener('websrc:ready', (e) => { ... });
            //
            // Option B — on window (what your module script uses):
            //   window.addEventListener('websrc:ready', (e) => { ... });
            //
            // Option C — if your script might load after Ready! already fired:
            //   if (window.__websrcReady) {
            //       // already done, handle immediately
            //   } else {
            //       window.addEventListener('websrc:ready', (e) => { ... });
            //   }
            //
            // ── DISMISSAL ──
            // Standard animated fade-out (call cleanup first):
            //   document.getElementById('preloader').classList.add('done');
            //
            // Silent instant kill (no animation, no flash — for specific pages):
            //   window.websrcKill();

            window.websrcKill = () => {
                const el = document.getElementById('preloader');
                if (!el) return;
                cleanup();
                el.style.transition = 'none';
                el.style.animation = 'none';
                el.style.opacity = '0';
                el.style.pointerEvents = 'none';
                requestAnimationFrame(() => el.remove());
            };

            // After the fade-out animation plays fully, cleanup all loops then
            // remove the element from the DOM entirely. animation-fill-mode: forwards
            // holds opacity:0 during the gap between animationend firing and remove()
            // executing, so there is no visible flash.
            // websrcKill() bypasses this and does an immediate hard remove.
            const preloaderEl = document.getElementById('preloader');
            if (preloaderEl) {
                preloaderEl.addEventListener('animationend', (e) => {
                    // Guard: only react to the preloaderOut animation, not any
                    // child animations (rings, pulse etc.) that might bubble up
                    if (e.animationName !== 'preloaderOut') return;
                    cleanup();
                    preloaderEl.remove();
                }, { once: true });
            };
            

        }
       
    </script>

</body>
